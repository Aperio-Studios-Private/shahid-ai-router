[package]
name = "sair-vault"
description = "OS credential vault abstraction (ADR-005). Secrets live only in the OS secure store; the database holds opaque references."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sair-domain = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = "1.0"

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
