[package]
name = "sair-vault"
description = "OS credential vault abstraction (ADR-005). Secrets live only in the OS secure store; the database holds opaque references."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
# OS-backed store (Windows Credential Manager / macOS Keychain) via keyring 4.x.
# App/release builds must enable this and must NOT enable `mock`.
os = ["dep:keyring"]
# Test-only in-memory store. Compile-error guard in lib.rs blocks release builds.
mock = []

[dependencies]
sair-domain = { workspace = true }
thiserror = { workspace = true }
ring = { workspace = true }
zeroize = { workspace = true }
keyring = { version = "4.2", features = ["v1"], optional = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
