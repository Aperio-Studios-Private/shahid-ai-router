[package]
name = "sair-gateway"
description = "Local loopback HTTP gateway (Axum): auth middleware, protocol surfaces, routing engine orchestration."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sair-domain = { workspace = true }
sair-vault = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
ring = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

subtle = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
# Plain-HTTP client for loopback integration tests (no TLS features needed).
reqwest = { workspace = true, default-features = false }
rustls = { workspace = true }
sair-vault = { workspace = true, features = ["mock"] }

[lints]
workspace = true
