[package]
name = "shahid-ai-router"
description = "Shahid AI Router desktop shell (Tauri 2): UI process, IPC commands, gateway lifecycle owner."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "shahid_ai_router_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
sair-domain = { workspace = true }
sair-gateway = { workspace = true }
sair-persistence = { workspace = true }
sair-providers = { workspace = true }
sair-vault = { workspace = true, features = ["os"] }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
rustls = { workspace = true }
ring = { workspace = true }
thiserror = { workspace = true }
argon2 = "0.6"
aes-gcm = "0.11"
base64 = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
dirs = "5"
tempfile = "3"
reqwest = { workspace = true }
url = "2"

[dev-dependencies]
tempfile = "3"
sair-vault = { workspace = true, features = ["mock"] }

[lints]
workspace = true
