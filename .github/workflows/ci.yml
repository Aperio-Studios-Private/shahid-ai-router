name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege (security review SEC2-06): read-only token by default.
permissions:
  contents: read

# Windows + macOS matrix per ADR-013. Linux is not a supported platform for v1.
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # generate_context! embeds frontendDist at compile time (there is no
      # devUrl anymore — debug builds embed the UI too), so the frontend must
      # exist before the Rust job compiles.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Build frontend (embedded by generate_context!)
        run: npm ci && npm run build
        working-directory: apps/desktop/ui
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build (app binary, no bundle)
        run: cargo build --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  # Dependency audit (Phase 11 plan F-11-2): the phase-11 report and
  # CHANGELOG record `cargo audit` + `npm audit` runs with 0 vulnerabilities;
  # this job makes the claim part of the pipeline (audit P1 fix — the
  # workflow previously never contained the job the evidence described).
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: npm-audit
        working-directory: apps/desktop/ui
        run: npm audit --omit=dev

  # Post-v1 candidates: tauri bundle builds, accessibility checks,
  # clean-machine install verification.
